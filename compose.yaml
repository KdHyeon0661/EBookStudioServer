name: ebookstudio

x-common-environment: &common-environment
  EBOOK_QUEUE_DB_PATH: /data/jobs.db
  EBOOK_STORAGE_ROOT: /data
  JOB_STALE_SECONDS: ${JOB_STALE_SECONDS:-900}
  JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-30}
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}

x-service-hardening: &service-hardening
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - backend
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ebookstudio}
      POSTGRES_USER: ${POSTGRES_USER:-ebookstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebookstudio-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  data-init:
    image: alpine:3.22
    user: "0:0"
    restart: "no"
    # Only the volume roots need ownership changes. Recursive chown would scan the
    # potentially large model cache on every restart.
    command: ["sh", "-c", "mkdir -p /data /models && chown 10001:10001 /data /models"]
    volumes:
      - app-data:/data
      - model-cache:/models
    networks:
      - backend

  api:
    <<: *service-hardening
    image: ebookstudio-api:${IMAGE_TAG:-local}
    build:
      context: ./spring-server
      dockerfile: Dockerfile
    environment:
      <<: *common-environment
      SERVER_PORT: 5000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ebookstudio}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ebookstudio}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ebookstudio-local}
      SECRET_KEY: ${SECRET_KEY:-}
      ACCESS_TOKEN_SECONDS: ${ACCESS_TOKEN_SECONDS:-3600}
      REFRESH_TOKEN_SECONDS: ${REFRESH_TOKEN_SECONDS:-604800}
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
      EMAIL_EXPOSE_DEVELOPMENT_CODE: ${EMAIL_EXPOSE_DEVELOPMENT_CODE:-false}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ebookstudio.local}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${API_MEMORY_LIMIT:-768m}

  analysis-worker:
    <<: *service-hardening
    image: ebookstudio-analysis-worker:${IMAGE_TAG:-local}
    build:
      context: ./python-worker
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-analyzer.txt
        INSTALL_AUDIO_TOOLS: "false"
    environment:
      <<: *common-environment
      WORKER_ROLE: analyze
      WORKER_HEALTH_MAX_AGE_SECONDS: 120
      HOME: /tmp
    volumes:
      - app-data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/worker_healthcheck.py", "analyze"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 45s
    stop_grace_period: 2m
    mem_limit: ${ANALYSIS_MEMORY_LIMIT:-2g}

  music-worker:
    <<: *service-hardening
    profiles: ["cpu-music"]
    image: ebookstudio-music-worker:${IMAGE_TAG:-local}
    build:
      context: ./python-worker
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-worker-cpu.txt
    environment:
      <<: *common-environment
      WORKER_ROLE: music_generation
      WORKER_HEALTH_MAX_AGE_SECONDS: 180
      MUSIC_GENERATOR_VERSION: ${MUSIC_GENERATOR_VERSION:-facebook/musicgen-small:v1}
      HOME: /tmp
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
    volumes:
      - app-data:/data
      - model-cache:/models
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/worker_healthcheck.py", "music_generation"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 2m
    stop_grace_period: 2m
    mem_limit: ${MUSIC_MEMORY_LIMIT:-16g}

  music-worker-gpu:
    <<: *service-hardening
    profiles: ["gpu"]
    image: ebookstudio-music-worker-gpu:${IMAGE_TAG:-local}
    build:
      context: ./python-worker
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-worker-cu130.txt
    environment:
      <<: *common-environment
      WORKER_ROLE: music_generation
      WORKER_HEALTH_MAX_AGE_SECONDS: 180
      MUSIC_GENERATOR_VERSION: ${MUSIC_GENERATOR_VERSION:-facebook/musicgen-small:v1}
      HOME: /tmp
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - app-data:/data
      - model-cache:/models
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "/app/worker_healthcheck.py", "music_generation"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 3m
    stop_grace_period: 2m
    mem_limit: ${MUSIC_MEMORY_LIMIT:-16g}

volumes:
  app-data:
  model-cache:
  postgres-data:

networks:
  backend:
    driver: bridge
